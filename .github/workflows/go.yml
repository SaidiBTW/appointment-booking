name: CI/CD Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - release
  push:
    branches:
      - release

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: appointment-booking-api
  IMAGE_NAME: gcr.io/${{ secrets.GCP_PROJECT_ID }}/appointment-booking-api:${{ github.sha }}

jobs:
  test:
    name: Run Go Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: api/go.sum

      - name: Install Dependencies
        run: |
          cd api
          go mod download

      - name: Run Tests
        run: |
          cd api
          go test -v -cover ./...

  deploy:
    name: Build & Deploy to Google Cloud Run
    needs: test
    if: github.ref == 'refs/heads/release' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GCP_CREDENTIALS_JSON: ${{ secrets.GCP_SA_KEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Google Cloud deployment configuration
        if: env.PROJECT_ID == '' || env.GCP_CREDENTIALS_JSON == ''
        run: echo "::notice::Skipping Cloud Run deployment because GCP_PROJECT_ID or GCP_SA_KEY is not configured for this workflow run."

      - name: Authenticate with Google Cloud
        if: env.PROJECT_ID != '' && env.GCP_CREDENTIALS_JSON != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_CREDENTIALS_JSON }}

      - name: Set up Cloud SDK
        if: env.PROJECT_ID != '' && env.GCP_CREDENTIALS_JSON != ''
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP
        if: env.PROJECT_ID != '' && env.GCP_CREDENTIALS_JSON != ''
        run: gcloud auth configure-docker --quiet

      - name: Build & Push Docker Image
        if: env.PROJECT_ID != '' && env.GCP_CREDENTIALS_JSON != ''
        run: |
          docker build -t $IMAGE_NAME ./api
          docker push $IMAGE_NAME

      - name: Deploy to Cloud Run
        if: env.PROJECT_ID != '' && env.GCP_CREDENTIALS_JSON != ''
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_NAME }}
          flags: "--allow-unauthenticated --port=8080"
          env_vars: |
            DATABASE_SSLMODE=disable
          secrets: |
            DATABASE_USER=projects/${{ secrets.GCP_PROJECT_ID }}/secrets/DB_USER/versions/latest
            DATABASE_PASSWORD=projects/${{ secrets.GCP_PROJECT_ID }}/secrets/DB_PASSWORD/versions/latest
            DATABASE_HOST=projects/${{ secrets.GCP_PROJECT_ID }}/secrets/DB_HOST/versions/latest
            DATABASE_PORT=projects/${{ secrets.GCP_PROJECT_ID }}/secrets/DB_PORT/versions/latest
            DATABASE_NAME=projects/${{ secrets.GCP_PROJECT_ID }}/secrets/DB_NAME/versions/latest
